# ARC CI — generated from the stratus arc-ci workflow template
# (build-python.yml there; see the arc-ci README for design and onboarding).
name: build

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: inference-e2e
    container: ghcr.io/astral-sh/uv:python3.11-bookworm
    steps:
      - name: clone
        run: |
          set -eu
          git clone --depth 1 "https://github.com/${{ github.repository }}.git" .
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            git fetch --depth 1 origin "pull/${{ github.event.pull_request.number }}/head"
          else
            git fetch --depth 1 origin "${{ github.sha }}"
          fi
          git checkout --detach FETCH_HEAD
      - name: lint
        run: |
          set -eu
          # Match the repo's own CI contract (old ci.yaml, Makefile):
          # ruff from the dev extra, scoped to src/ and tests/ — not the
          # whole repo. Prefer the repo's own pinned ruff (uv.lock) so
          # formatting verdicts match the repo's CI; fall back to latest
          # for repos that don't pin ruff.
          if [ -f uv.lock ] && grep -q 'name = "ruff"' uv.lock; then
            # --all-extras: ruff lives in the project's dev extra, and a
            # bare `uv sync` installs no extras at all.
            uv sync --quiet --all-extras
            uv run ruff check src/ tests/
            uv run ruff format --check src/ tests/
          else
            uvx ruff check src/ tests/
            uvx ruff format --check src/ tests/
          fi
      - name: test
        run: |
          set -eu
          if [ -f pyproject.toml ] && grep -q '\[tool.pytest' pyproject.toml; then
            uv sync
            # Unit tests only: conformance/e2e suites need a live
            # cluster and run as dedicated CI jobs, not in build CI.
            uv run pytest --ignore=tests/test_conformance.py
          elif [ -f Makefile ] && grep -q '^test:' Makefile; then
            make test
          else
            echo "no test target found; skipping"
          fi

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: inference-e2e-build
    container: quay.io/buildah/stable:v1.38.0
    environment: quay-push
    steps:
      - name: fetch source
        # quay.io/buildah/stable ships curl and tar but no git (its
        # install set is just buildah/fuse-overlayfs/ucpp) — pull the
        # source tarball instead. Publish only runs on pushes to main,
        # so github.sha is the ref; the tarball extracts to
        # <repo>-<sha>/, hence --strip-components=1. Bridge until the
        # purpose-built ci-driver image (buildah + git) exists.
        run: |
          set -eu
          curl -sL "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz" \
            | tar xz --strip-components=1
      - name: build-and-push
        env:
          # No _CONTAINERS_ROOTLESS_UID: the job runs rootful uid 0,
          # and that var forces buildah's rootless child path (a userns
          # keyed to the claimed uid), where RUN steps fail setting
          # capabilities with EPERM. See the build-go template's
          # build-and-push step for the full story.
          BUILDAH_ISOLATION: chroot
          REGISTRY_AUTH_FILE: /tmp/auth.json
        run: |
          set -euo pipefail
          if [ ! -f Dockerfile ]; then
            echo "no Dockerfile; skipping publish"
            exit 0
          fi
          echo "${{ secrets.QUAY_PASSWORD }}" | buildah login --authfile "$REGISTRY_AUTH_FILE" \
            --username "${{ secrets.QUAY_USERNAME }}" --password-stdin quay.io
          IMG="quay.io/klape/inference-e2e:${{ github.sha }}"
          # The ci-buildah SCC force-drops KILL and MKNOD from the pod's
          # bounding set, but buildah grants RUN children a default
          # capability set that includes KILL — its capset then fails
          # with EPERM ("error setting capabilities for process") at
          # the first RUN step. Mirror the SCC drops onto the bud
          # command; no RUN step needs them. (The old Tekton task dodged
          # this by running its build step privileged; this workflow
          # runs least-privilege with SYS_ADMIN + SYS_CHROOT instead.)
          # --ulimit: buildah's spec raises RLIMIT_NOFILE to 1048576
          # (docker's default), but this cluster's runtime gives
          # containers 524288, and raising a hard limit needs
          # CAP_SYS_RESOURCE. Pin the spec's nofile to the pod's
          # actual limits so the setrlimit is a no-op.
          buildah --storage-driver=vfs bud --cap-drop=KILL --cap-drop=MKNOD --ulimit nofile=$(ulimit -Sn):$(ulimit -Hn) --platform=linux/amd64 -f Dockerfile -t "$IMG" .
          buildah --storage-driver=vfs push "$IMG"
          buildah --storage-driver=vfs tag "$IMG" "quay.io/klape/inference-e2e:latest"
          buildah --storage-driver=vfs push "quay.io/klape/inference-e2e:latest"
